<!doctype html>
<html lang="fr">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4ec" />
    <meta name="description" content="Webtober 2026 : le mois d’octobre en calendrier, avec un aperçu de chaque expérience." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=DM+Sans:wght@400;450;500;550;600;650;700&display=swap" rel="stylesheet" />
    <title>Webtober 2026</title>

  <body>
    <div class="gallery-shell">
      <header class="gallery-header">
        <a class="gallery-brand" href="/" aria-label="Webtober, accueil"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 4v24M4 16h24M7.5 7.5l17 17m0-17-17 17" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="16" cy="16" r="5" fill="#f5f4ec" stroke="currentColor" stroke-width="2"/></svg><span>webtober<span class="brand-dot">.</span></span></a>
        <span class="edition-badge">Édition octobre 2026</span>
      </header>
      <main>
        <section class="gallery-intro" aria-label="Progression de la collection">
          <div class="collection-progress"><span class="progress-label">LA COLLECTION PREND VIE</span><p><strong id="available-count">02</strong><span>/ 31</span></p><div class="progress-dots" id="progress-dots" aria-hidden="true"></div><span class="progress-caption" id="progress-caption">2 expériences à découvrir.</span></div>
        </section>
        <section class="calendar-section" aria-labelledby="calendar-title">
          <div class="collection-heading"><h1 id="calendar-title">Octobre 2026</h1><span class="collection-note"><i aria-hidden="true"></i> Chaque jour, une nouvelle idée</span></div>
          <div class="calendar" id="calendar">
            <div class="calendar-weekdays" aria-hidden="true"><span>Lun</span><span>Mar</span><span>Mer</span><span>Jeu</span><span>Ven</span><span>Sam</span><span>Dim</span></div>
            <ol class="calendar-grid" id="calendar-grid"></ol>
          </div>
          <noscript><p><a href="/1">Découvrir le jour 1 : Pomme</a> · <a href="/2">Découvrir le jour 2 : Relique</a></p></noscript>
        </section>
      </main>
      <footer class="gallery-footer"><span>Webtober 2026 <span aria-hidden="true">·</span> 31 jours de créativité</span></footer>
    </div>
    <script type="module" src="./gallery/main.js"></script>
  </body>
